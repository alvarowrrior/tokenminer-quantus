[package]
name = "tokenminer-quantus"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[lib]
name = "tokenminer_quantus"
path = "src/lib.rs"

[dependencies]
bytemuck = "1.16"
engine-cpu = { path = "vendor/quantus-miner/crates/engine-cpu" }
engine-gpu = { path = "vendor/quantus-miner/crates/engine-gpu" }
pow-core = { path = "vendor/quantus-miner/crates/pow-core" }
hex = "0.4"
primitive-types = "0.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "27.0.1"

[target.'cfg(windows)'.dependencies]
cudarc = { version = "0.19.9", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12080"] }

[profile.release]
lto = "thin"
codegen-units = 1
